name: Format

on:
  pull_request

jobs:
  build:
    name: Apply Spotless Formatting
    runs-on: ubuntu-latest
    container: wpilib/roborio-cross-ubuntu:2025-24.04 # https://hub.docker.com/r/wpilib/roborio-cross-ubuntu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
      - name: Run spotlessApply
        run: ./gradlew spotlessApply --no-daemon
      - name: Make repository safe
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      # Debug Step: show any changes made by spotless apply
      - name: Check Git Status
        run: git status --porcelain
      # Helper step: set a changed 'output' (variuble)
      - name: Detect changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push formatting changes
        if: ${{ steps.check_changes.outputs.changed == 'true' }}
        run: |
          git config user.name "Build and Format Action"
          git config user.email "144858100+AceiusRedshift@users.noreply.github.com"
          git add -A
          git commit -m "(Automatic) Apply formatting"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
